resources:

    - name: mainvpc
      type: compute.v1.network
      properties:
        autoCreateSubnetworks: false

    - name: frontend
      type: compute.v1.subnetwork
      properties:
        region: europe-west2
        network: $(ref.mainvpc.selfLink)
        ipCidrRange: 10.0.1.0/24

    - name: backend
      type: compute.v1.subnetwork
      properties:
        region: europe-west2
        network: $(ref.mainvpc.selfLink)
        ipCidrRange: 10.0.3.0/24

    - name: cloudiaczone
      type: dns.v1.managedZone
      properties:
        dnsName: cloudiac.com.
        description: Hosted Zone for CloudiacZone

    - name: useruploadscloudiac
      type: storage.v1.bucket
      properties:
        location: europe-west2
        versioning:
          enabled: false
        labels:
          city: london

    - name: databaseserver
      type: compute.v1.instance
      properties:
        zone: europe-west2-a
        machineType: zones/europe-west2-a/machineTypes/e2-small
        networkInterfaces:
          - subnetwork: $(ref.backend.selfLink)
        disks:
          - boot: true
            autoDelete: true
            initializeParams:
              sourceImage: projects/debian-cloud/global/images/family/debian-13

    - name: frontendserver
      type: compute.v1.instance
      properties:
        zone: europe-west2-a
        machineType: zones/europe-west2-a/machineTypes/e2-small
        networkInterfaces:
          - subnetwork: $(ref.frontend.selfLink)
        disks:
          - boot: true
            autoDelete: true
            initializeParams:
              sourceImage: projects/debian-cloud/global/images/family/debian-13

    - name: backendserver
      type: compute.v1.instance
      properties:
        zone: europe-west2-a
        machineType: zones/europe-west2-a/machineTypes/e2-small
        networkInterfaces:
          - subnetwork: $(ref.backend.selfLink)
        disks:
          - boot: true
            autoDelete: true
            initializeParams:
              sourceImage: projects/debian-cloud/global/images/family/debian-13